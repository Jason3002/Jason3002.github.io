version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Asia/Kuala_Lumpur'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'build(bun)'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'bun'
